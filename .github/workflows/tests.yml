name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python check_env.py --demo
      - run: python -m pytest -q
      - run: python demo.py --with-patients --output runs/demo.json
      - run: python evaluate.py --output runs/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-python-${{ matrix.python-version }}
          path: |
            runs/demo.html
            runs/demo.json
            runs/demo.md
            runs/demo.evidence.*
            runs/evaluation.*
            runs/evaluation.traces/*.json
